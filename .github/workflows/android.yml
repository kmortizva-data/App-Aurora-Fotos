name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AuroraFotos-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraFotos-debug-apk
          path: AuroraFotos-debug.apk

      # A rolling pre-release so the APK can be downloaded straight from the
      # phone's browser without logging into GitHub Actions.
      - name: Publish rolling pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Latest debug APK"
          prerelease: true
          body: |
            Build automático de la rama `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Descarga `AuroraFotos-debug.apk` desde el teléfono e instálalo (permite "fuentes desconocidas").
          files: AuroraFotos-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
